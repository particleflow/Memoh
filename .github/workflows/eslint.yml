name: ESLint

on:
  push:
    branches: ["main"]
    paths:
      - ".husky/**"
      - "scripts/hook-checks.test.mjs"
      - "scripts/display-prepare.sh"
      - "apps/**/*.js"
      - "apps/**/*.cjs"
      - "apps/**/*.mjs"
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "apps/**/*.vue"
      - "docker/**"
      - "packages/**"
      - "packages/**/*.js"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "packages/**/*.vue"
      - "scripts/**/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/eslint.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: ["main", "feat/**"]
    paths:
      - ".husky/**"
      - "scripts/hook-checks.test.mjs"
      - "scripts/display-prepare.sh"
      - "apps/**/*.js"
      - "apps/**/*.cjs"
      - "apps/**/*.mjs"
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "apps/**/*.vue"
      - "docker/**"
      - "packages/**"
      - "packages/**/*.js"
      - "packages/**/*.ts"
      - "packages/**/*.tsx"
      - "packages/**/*.vue"
      - "scripts/**/*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/eslint.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: UI contract guard
        run: node scripts/check-ui-contract.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test commit hook selection and execution
        run: node --test scripts/hook-checks.test.mjs
      - name: Test release scripts
        run: node --test scripts/publish-auth.test.mjs
      - name: Test display preparation lock recovery
        run: node --test scripts/display-prepare-lock.test.mjs
      - name: Test display input and clipboard regressions
        run: pnpm test --run --testTimeout=15000 apps/web/src/composables/display-text-input.test.ts apps/web/src/composables/useDisplayClipboard.test.ts apps/web/src/composables/display-clipboard.test.ts apps/web/src/composables/useBotDisplayConnection.test.ts apps/web/src/utils/api-error.test.ts apps/web/src/composables/api/sse-error.test.ts
      - name: Test task observation and Bot management
        env:
          # jsdom owns browser storage; Node 24's experimental process-global
          # storage has no backing file and is not the application DOM.
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test --run --testTimeout=15000 apps/web/src/pages/home/composables/useBotDelegations.test.ts apps/web/src/pages/home/composables/useSessionTasks.test.ts apps/web/src/pages/home/composables/useComputerTaskDeliveries.test.ts apps/web/src/pages/home/components/session-task-results.test.ts apps/web/src/pages/home/components/bot-delegation-tasks.test.ts apps/web/src/pages/home/components/session-tasks.test.ts apps/web/src/pages/bots/index.test.ts apps/web/src/pages/bots/new.test.ts apps/web/src/pages/bots/detail.not-found.test.ts apps/web/src/pages/bots/components/bot-network.test.ts
      - name: Test server entrypoint
        run: pnpm test --run --project docker
      - name: Run Vitest
        run: pnpm test --run --testTimeout=15000 apps/web/src/composables/api/useChat.ws.test.ts apps/web/src/store/chat-list.test.ts apps/web/src/store/chat/transcript.test.ts apps/web/src/pages/home/composables/useComposerUpload.test.ts apps/web/src/pages/home/composables/useComposerUpload.lifecycle.test.ts apps/web/src/pages/home/components/attachment-block.test.ts apps/web/src/components/file-manager/file-viewer.save.test.ts
      - name: Typecheck Web
        run: pnpm --filter @memohai/web typecheck
