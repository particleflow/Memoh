name: Native delivery fixtures
on:
  pull_request:
    paths:
      - 'internal/transferclient/**'
      - 'cmd/transferqueue/**'
      - 'contrib/herdr/memoh-delivery/**'
      - 'scripts/build-transferqueue-bundle.py'
      - '.github/workflows/delivery-native.yml'
      - 'internal/db/computer_delivery_native_windows_test.go'
      - 'scripts/test-native-delivery-postgres.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows NTFS isolated fixtures
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Execute native tests
        run: go test -count=1 -v -timeout=5m ./internal/transferclient
      - name: Execute native publication with PostgreSQL
        run: ./scripts/test-native-delivery-postgres.ps1
      - name: Build reviewed binary bundle
        run: python scripts/build-transferqueue-bundle.py --output '${{ runner.temp }}/delivery-windows-amd64'
      - name: Verify packaged executable
        run: "& '${{ runner.temp }}/delivery-windows-amd64/verify-fixtures.ps1'"
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-windows-amd64
          path: ${{ runner.temp }}/delivery-windows-amd64
          retention-days: 7
          if-no-files-found: error
