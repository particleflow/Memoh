name: Go CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "go.work*"
      - ".golangci.*"
      # Include embedded assets and test fixtures, not just source extensions.
      - "internal/**"
      - "cmd/**"
      - "db/**"
      - "templates/**"
      - "conf/**"
      - "docker/**"
      - "spec/**"
      - "scripts/**"
      - "mise.toml"
      - ".github/workflows/go-ci.yml"
  pull_request:
    # Stacked feature PRs need the same validation before their base is merged.
    branches: ["main", "feat/**", "fix/**", "integrate/**"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "go.work*"
      - ".golangci.*"
      # Include embedded assets and test fixtures, not just source extensions.
      - "internal/**"
      - "cmd/**"
      - "db/**"
      - "templates/**"
      - "conf/**"
      - "docker/**"
      - "spec/**"
      - "scripts/**"
      - "mise.toml"
      - ".github/workflows/go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-core-boundary:
    name: Agent core boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unmodified upstream Agent core
        run: bash scripts/check-agent-core-boundary.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          # Use the checked-out Git history for PRs: the REST diff endpoint
          # refuses integrated stacks above 20,000 lines. Preserve the same
          # changed-line lint policy without silently falling back to all code.
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: ${{ github.event_name == 'pull_request' && format('--new-from-merge-base={0}', github.event.pull_request.base.sha) || '' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.txt
          if-no-files-found: error

  pgvector-bootstrap:
    name: Pgvector bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgvector:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: memoh_vector_test
          POSTGRES_USER: memoh
          POSTGRES_PASSWORD: memoh123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoh -d memoh_vector_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test versioned pgvector schema and queries
        env:
          TEST_PGVECTOR_DSN: postgres://memoh:memoh123@127.0.0.1:5432/memoh_vector_test?sslmode=disable
        run: go test -count=1 ./internal/db/pgvector ./internal/memory/adapters/builtin

  session-runtime-backend:
    name: Session Runtime (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Redis
            image: redis:8-alpine
            env_name: MEMOH_TEST_REDIS_URL
          - target: Valkey
            image: valkey/valkey:8-alpine
            env_name: MEMOH_TEST_VALKEY_URL
    services:
      runtime:
        image: ${{ matrix.image }}
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "sh -c 'redis-cli ping || valkey-cli ping'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run distributed session runtime contracts
        env:
          MEMOH_TEST_DISTRIBUTED_REQUIRED: "1"
          RUNTIME_URL: redis://127.0.0.1:${{ job.services.runtime.ports['6379'] }}/0
          RUNTIME_ENV_NAME: ${{ matrix.env_name }}
        run: env "$RUNTIME_ENV_NAME=$RUNTIME_URL" go test -v -race -count=1 -timeout 90s ./internal/agent/runtime/session

  session-runtime-postgres:
    name: Session Runtime (PostgreSQL fencing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: memoh_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d memoh_runtime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run durable runtime fencing contracts
        env:
          MEMOH_TEST_DISTRIBUTED_REQUIRED: "1"
          MEMOH_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          MEMOH_TEST_POSTGRES_REQUIRED: "1"
          TEST_POSTGRES_BOOTSTRAP_SCHEMA: "1"
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: |
          go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgres(RuntimeFence|WaitingDecision)' ./internal/runtimefence
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresRuntimeFence' ./internal/chat/message
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresRuntimeFence' ./internal/agent/runtime/acp
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            ./internal/agent/runtime/session/ledger
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgres(ResumeScopes|WSStepHistory|ProviderUsage|RedisDecision|NativeDecisionAcceptance|HistoryReset|RedisHistoryReset)' ./internal/agent/application
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresBotCreate' ./internal/bots
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgresDiscuss(RecoveryPreservesBatchAcrossCompactorRestart|BacklogOverBudgetIsAnsweredAndNextRoundContinues|BacklogWithoutCompactionIsAnsweredAndRecordsOmission|OversizedInputFailsOnceThenNextMessageIsAnswered|ImageBacklogKeepsImagesOnTheirMessages|OversizedImageInputFailsOnceThenNextMessageIsAnswered|ImageBacklogYieldsAnsweredHistoryFirst|CompactedImageInputIsRecorded|CompactionKeepsBatchTextOverImages)$' ./cmd/agent
          TEST_POSTGRES_BOOTSTRAP_SCHEMA=0 go test -v -race -count=1 -timeout 90s \
            -run '^TestPostgres(SummaryOnlyRollup|CompleteCompactionRollup)' ./internal/chat/message
      - name: Verify native memory lifecycle and source isolation
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: |
          # The fencing step above applies the server's full migration chain.
          # A missing DSN must fail this step instead of skipping PG fixtures.
          : "${TEST_POSTGRES_DSN:?Native memory tests require the migrated PostgreSQL database}"
          set -o pipefail
          go test -json -race -count=1 -timeout 90s ./internal/memory/... | tee memory-postgres-tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = {
              "TestPostgresMemoryLifecycleDeleteHealthyRebuild",
              "TestPostgresMemoryLifecycleDeleteOutageMustNotResurrect",
              "TestPostgresMemoryLifecycleAuthoredMarkdownForget",
              "TestPostgresMemoryLifecycleUnreadableProjection",
              "TestPostgresUpsertNodeConcurrentlyUnionsSourceRefs",
              "TestPostgresUpsertNodeRejectsConflictingBotScope",
          }
          events = [json.loads(line) for line in Path("memory-postgres-tests.jsonl").read_text().splitlines()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          missing = required - passed
          if missing:
              raise SystemExit("Required PostgreSQL tests did not PASS (missing, skipped or failed): " + ", ".join(sorted(missing)))
          print("Verified PostgreSQL PASS: " + ", ".join(sorted(required)))
          PY
      - name: Verify canonical memory file references on PostgreSQL
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
          MEMOH_TEST_MEMORY_FILES_REQUIRED: "1"
        run: |
          # The fencing step applies the server's full migration chain.
          : "${TEST_POSTGRES_DSN:?Memory file references require PostgreSQL}"
          set -o pipefail
          go test -json -race -count=1 -timeout 90s -run '^TestPostgresMemoryFileReferenceLifecycle$' ./internal/memory/adapters/builtin | tee memory-file-refs.jsonl
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path("memory-file-refs.jsonl").read_text().splitlines()]
          assert any(event.get("Action") == "pass" and event.get("Test") == "TestPostgresMemoryFileReferenceLifecycle" for event in events), "required memory file reference regression did not PASS"
          PYTEST
      - name: Verify atomic connector disconnect and computer delivery contracts
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: >-
          go test -v -race -tags=integration -count=1 -timeout 90s
          -run '^Test(ConnectorDisconnectFinalizationIsAtomicAndScoped|ComputerDeliveryPostgres.*)$' ./internal/db
      - name: Verify scoped delegation and task observation on PostgreSQL
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: |
          : "${TEST_POSTGRES_DSN:?Delegation and task observation tests require PostgreSQL}"
          set -o pipefail
          go test -json -race -tags=integration -count=1 -timeout 90s \
            -run '^Test(BotDelegationPostgresClaimIsolationAndDescendantAssets|SessionTasksPostgresOwnedTreeAndStableCursor|SessionTasksPostgresLatestChildRunAndMessage)$' ./internal/db | tee delegation-postgres-tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = {
              "TestBotDelegationPostgresClaimIsolationAndDescendantAssets",
              "TestSessionTasksPostgresOwnedTreeAndStableCursor",
              "TestSessionTasksPostgresLatestChildRunAndMessage",
          }
          events = [json.loads(line) for line in Path("delegation-postgres-tests.jsonl").read_text().splitlines()]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          missing = required - passed
          if missing:
              raise SystemExit("Required PostgreSQL tests did not PASS: " + ", ".join(sorted(missing)))
          print("Verified PostgreSQL PASS: " + ", ".join(sorted(required)))
          PY
      # Additive gate: retain the other contract steps when merging stacked workflows.
      - name: Require computer operation CAS and RLS (no skips)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: bash scripts/test-computer-operations-postgres.sh
      # Add this gate without replacing any existing integration contracts.
      - name: Require Pi batch history scope and latest evidence (no skips)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/memoh_runtime_test?sslmode=disable
        run: bash scripts/test-pi-batch-history-postgres.sh
