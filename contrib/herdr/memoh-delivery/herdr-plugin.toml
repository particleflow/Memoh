id = "memoh.delivery"
name = "Memoh delivery storage"
version = "0.4.0"
min_herdr_version = "0.9.5"
description = "Finite native delivery queue using a configured reusable device identity"
platforms = ["windows"]

[[actions]]
id = "verify-storage"
title = "Verify native delivery storage"
contexts = ["workspace"]
command = ["./transferqueue.exe", "-action", "probe"]

[[actions]]
id = "advance-delivery"
title = "Advance one due delivery"
contexts = ["workspace"]
command = ["./transferqueue.exe", "-action", "advance-results"]

[[actions]]
id = "fixture-check"
title = "Run isolated delivery fixtures"
contexts = ["workspace"]
command = ["./transferqueue.test.exe", "-test.run=^TestWindowsNative", "-test.v", "-test.timeout=5m"]

[[actions]]
id = "collect-result"
title = "Collect one closed task result"
contexts = ["workspace"]
command = ["./transferqueue.exe", "-action", "collect-result"]
