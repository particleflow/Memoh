# Standalone file: never merge this with the production docker-compose.yml.
name: memoh-acceptance-40f0a69

x-server-image: &server-image ghcr.io/particleflow/server@sha256:88833a498d9ddb11c001ade9922d1c7e4846b042a160b699996082460776c937
x-config: &config
  type: bind
  source: ${ACCEPTANCE_ROOT:?Set a new dedicated acceptance root}/config/config.toml
  target: /app/config.toml
  read_only: true
  bind:
    create_host_path: false
x-data: &data
  type: bind
  source: ${ACCEPTANCE_ROOT:?Set a new dedicated acceptance root}/data
  target: /opt/memoh/data
  bind:
    create_host_path: false
x-originals: &originals
  type: bind
  source: ${ACCEPTANCE_ROOT:?Set a new dedicated acceptance root}/originals
  target: /opt/memoh/originals
  bind:
    create_host_path: false

services:
  postgres:
    image: ${ACCEPTANCE_POSTGRES_IMAGE:?Set a locally cached PostgreSQL 18 digest reference}
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_DB: acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
    volumes:
      - type: bind
        source: ${ACCEPTANCE_ROOT}/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - type: bind
        source: ${ACCEPTANCE_ROOT}/config/pg-password
        target: /run/secrets/pg-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acceptance -d acceptance"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acceptance]

  migrate:
    image: *server-image
    pull_policy: never
    entrypoint: [/app/memoh-server, migrate, up]
    restart: "no"
    volumes: [*config, *data, *originals]
    # Cover the image's unused VOLUME; do not create an anonymous volume.
    tmpfs: [/var/lib/containerd]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [acceptance]

  server:
    image: *server-image
    pull_policy: never
    restart: "no"
    stop_grace_period: 45s
    # Full workspace startup requires the separately reviewed override.
    privileged: false
    mem_limit: 4g
    environment:
      GOMEMLIMIT: 3GiB
      MEMOH_ORIGINALS_ROOT: /opt/memoh/originals
    volumes:
      - *config
      - *data
      - *originals
      - type: bind
        source: ${ACCEPTANCE_ROOT}/containerd
        target: /var/lib/containerd
        bind:
          create_host_path: false
      - type: bind
        source: ${ACCEPTANCE_ROOT}/cni
        target: /var/lib/cni
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [acceptance]

  channel:
    image: *server-image
    pull_policy: never
    entrypoint: [/app/memoh-channel, serve]
    restart: "no"
    volumes: [*config]
    tmpfs: [/var/lib/containerd, /opt/memoh/data]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8081/health]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acceptance]

  web:
    image: ghcr.io/particleflow/web@sha256:dccb0f1da7b4d24240fec929c0e6cdb32d81c051abd18c3f011cee3c8b08e27c
    pull_policy: never
    restart: "no"
    environment:
      MEMOH_SERVER_UPSTREAM: server:8080
      MEMOH_CHANNEL_UPSTREAM: channel:8081
    ports:
      - target: 8082
        published: ${ACCEPTANCE_WEB_PORT:?Choose an unused loopback port}
        host_ip: 127.0.0.1
    depends_on:
      server:
        condition: service_healthy
      channel:
        condition: service_healthy
    networks: [acceptance]

networks:
  acceptance:
    internal: true
